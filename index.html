<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametric Fence Calculator</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --accent: #0056b3;
            --border: #dddddd;
            --success: #28a745;
            --warning: #dc3545;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: var(--accent);
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1em;
        }
        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .result-item {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }
        .result-item span {
            display: block;
            font-size: 1.5em;
            font-weight: bold;
            color: var(--accent);
            margin-top: 5px;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        .suggestions-box {
            background: #e9ecef;
            text-align: left;
            padding: 15px;
            border-radius: 6px;
        }
        .suggestions-box h3 {
            margin-top: 0;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        .suggestion-item {
            background: #fff;
            padding: 10px;
            margin-bottom: 8px;
            border-left: 4px solid var(--accent);
            border-radius: 4px;
        }
        #visualizer {
            width: 100%;
            height: 200px;
            background-color: #e9ecef;
            border-radius: 6px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Fence Parameters</h2>
        <div class="input-group">
            <label for="runLength">Overall Run Length (inches)</label>
            <input type="number" id="runLength" value="300" step="0.1" min=0>
        </div>
        <div class="input-group">
            <label for="maxSection">Max Section Length (inches)</label>
            <input type="number" id="maxSection" value="96" step="0.1">
        </div>
        <div class="input-group">
            <label for="postWidth">Post Width (inches)</label>
            <input type="number" id="postWidth" value="1.5" step="0.1">
        </div>
        <div class="input-group">
            <label for="picketWidth">Picket Width (inches)</label>
            <input type="number" id="picketWidth" value="0.5" step="0.1">
        </div>
        <div class="input-group">
            <label for="ringDiameter">Target Ring Diameter (inches)</label>
            <input type="number" id="ringDiameter" value="3.75" step="0.1">
        </div>
        <div class="input-group">
            <label for="gapTolerance">Gap Tolerance (inches) +/-</label>
            <input type="number" id="gapTolerance" value="0.0625" step="0.01">
        </div>
    </div>

    <div class="card">
        <h2>Calculated Results</h2>
        <div class="results-grid">
            <div class="result-item">Total Sections <span id="outSections">0</span></div>
            <div class="result-item">Total Posts <span id="outPosts">0</span></div>
            <div class="result-item full-width">Exact Section Length <span id="outSectionLength">0"</span></div>
            <div class="result-item">Pickets per Section <span id="outPickets">0</span></div>
            <div class="result-item">Actual Spacing <span id="outSpacing">0"</span></div>
            <div class="result-item full-width">
                Ring Fit Status 
                <span id="outFitment">-</span>
            </div>
            
            <div class="full-width suggestions-box">
                <h3>Perfect Length Suggestions</h3>
                <div id="outSuggestions">Calculating...</div>
            </div>
        </div>
    </div>

    <div class="card full-width">
        <h2>Single Section Schematic</h2>
        <p style="font-size: 0.9em; color: #666;">Visual representation of exactly one calculated section (scaled to fit).</p>
        <div id="visualizer"></div>
    </div>
</div>

<script>
    function calculate() {
        // 1. Gather Inputs
        const L = parseFloat(document.getElementById('runLength').value) || 0;
        const S_max = parseFloat(document.getElementById('maxSection').value) || 96;
        const W_post = parseFloat(document.getElementById('postWidth').value) || 1.5;
        const W_picket = parseFloat(document.getElementById('picketWidth').value) || 0.5;
        const D_ring = parseFloat(document.getElementById('ringDiameter').value) || 3.75;
        const T_gap = parseFloat(document.getElementById('gapTolerance').value) || 0;

        // 2. Macro Logic (Sections & Posts)
        const N = Math.ceil((L - W_post) / (S_max + W_post));
        const numPosts = N > 0 ? N + 1 : 0;
        const S_L = N > 0 ? (L - (numPosts * W_post)) / N : 0;

        // 3. Micro Logic (Pickets & Rings)
        const P = Math.max(0, Math.round((S_L - D_ring) / (D_ring + W_picket)));
        const S_actual = P >= 0 ? (S_L - (P * W_picket)) / (P + 1) : 0;

        // 4. Ring Fitment & Tolerance Logic
        const diff = Math.abs(S_actual - D_ring);
        const fitmentEl = document.getElementById('outFitment');
        
        if (diff <= T_gap) {
            fitmentEl.innerText = `Acceptable (Off by ${diff.toFixed(3)}")`;
            fitmentEl.style.color = "var(--success)";
        } else if (S_actual < D_ring) {
            fitmentEl.innerText = `Out of tolerance (Off by ${diff.toFixed(3)}") `;
            fitmentEl.style.color = "var(--warning)";
        } else {
            fitmentEl.innerText = `Acceptable Gap of ${diff.toFixed(3)}"`;
            fitmentEl.style.color = "var(--success)";
        }

        // 5. Calculate Perfect Length Suggestions
        let candidates = [];
        // Look at current number of sections, plus/minus a few to find adjacent options
        let startN = Math.max(1, N - 2);
        let endN = N + 2;

        for (let n = startN; n <= endN; n++) {
            // Test picket counts from 1 up to a safe maximum
            for (let p = 1; p < 100; p++) {
                let s_ideal = (p * W_picket) + ((p + 1) * D_ring);
                if (s_ideal <= S_max) {
                    let l_ideal = (n * s_ideal) + ((n + 1) * W_post);
                    candidates.push({ L: l_ideal, N: n, P: p, S: s_ideal });
                } else {
                    break; // Section length exceeded max, stop incrementing pickets for this N
                }
            }
        }

        // Sort candidates by total length
        candidates.sort((a, b) => a.L - b.L);

        // Find closest shorter and longer lengths
        let shorter = candidates.slice().reverse().find(c => c.L < L - 0.001);
        let longer = candidates.find(c => c.L > L + 0.001);

        let suggestionsHTML = "";
        
        if (diff <= 0.001) {
            suggestionsHTML = `<em>Current length is already mathematically perfect.</em>`;
        } else {
            if (shorter) {
                let diffShort = L - shorter.L;
                suggestionsHTML += `
                    <div class="suggestion-item">
                        <strong>Shrink to ${shorter.L.toFixed(2)}"</strong> (-${diffShort.toFixed(2)}")<br>
                        <span style="font-size: 0.9em; color: #555;">${shorter.N} sections @ ${shorter.S.toFixed(2)}" | ${shorter.P} pickets per sec</span>
                    </div>`;
            }
            if (longer) {
                let diffLong = longer.L - L;
                suggestionsHTML += `
                    <div class="suggestion-item">
                        <strong>Stretch to ${longer.L.toFixed(2)}"</strong> (+${diffLong.toFixed(2)}")<br>
                        <span style="font-size: 0.9em; color: #555;">${longer.N} sections @ ${longer.S.toFixed(2)}" | ${longer.P} pickets per sec</span>
                    </div>`;
            }
        }
        document.getElementById('outSuggestions').innerHTML = suggestionsHTML || "No valid suggestions found.";

        // 6. Update DOM Results
        document.getElementById('outSections').innerText = N;
        document.getElementById('outPosts').innerText = numPosts;
        document.getElementById('outSectionLength').innerText = S_L.toFixed(3) + '"';
        document.getElementById('outPickets').innerText = P;
        document.getElementById('outSpacing').innerText = S_actual.toFixed(3) + '"';

        // 7. Draw SVG Schematic
        if(S_L > 0) drawSchematic(S_L, W_post, W_picket, P, S_actual, D_ring);
    }

    function drawSchematic(S_L, W_post, W_picket, P, S_actual, D_ring) {
        const totalVisualWidth = S_L + (W_post * 2);
        const fenceHeight = 50; 
        
        let svg = `<svg viewBox="0 0 ${totalVisualWidth} ${fenceHeight}" style="width:100%; height:100%;">`;
        
        // Left Post
        svg += `<rect x="0" y="0" width="${W_post}" height="${fenceHeight}" fill="#333" />`;
        
        // Rails
        svg += `<rect x="${W_post}" y="11" width="${S_L}" height="2" fill="#555" />`;
        svg += `<rect x="${W_post}" y="5" width="${S_L}" height="2" fill="#555" />`;
        svg += `<rect x="${W_post}" y="45" width="${S_L}" height="2" fill="#555" />`;

        // Pickets & Rings
        let currentX = W_post;
        for (let i = 0; i <= P; i++) {
            let ringRadius = (S_actual > D_ring ? D_ring : S_actual) / 2;
            let ringCx = currentX + (S_actual / 2);
            let ringCy = 9; 
            svg += `<circle cx="${ringCx}" cy="${ringCy}" r="${ringRadius}" fill="none" stroke="#0056b3" stroke-width="1" />`;
            
            currentX += S_actual;

            if (i < P) {
                svg += `<rect x="${currentX}" y="5" width="${W_picket}" height="40" fill="#666" />`;
                currentX += W_picket;
            }
        }

        // Right Post
        svg += `<rect x="${totalVisualWidth - W_post}" y="0" width="${W_post}" height="${fenceHeight}" fill="#333" />`;
        svg += `</svg>`;

        document.getElementById('visualizer').innerHTML = svg;
    }

    // Attach event listeners
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
        input.addEventListener('input', calculate);
    });

    // Initial run
    calculate();
</script>
</body>
</html>
